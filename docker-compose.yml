services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/salud', timeout=2).read()"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - eco-interno

  nginx:
    profiles:
      - production
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-ecocircular-obonuco.edu.co}
      NGINX_ENVSUBST_FILTER: ^DOMAIN$
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
      - ./deploy/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - eco-interno

  nginx-bootstrap:
    build:
      context: ./frontend
    profiles:
      - bootstrap
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - acme-webroot:/var/www/certbot
      - ./deploy/nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eco-interno

  # Frontend + HTTPS (certificado autofirmado) para la intranet. Es el servicio por defecto.
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/selfsigned.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eco-interno

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certificates
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot

networks:
  eco-interno:
    driver: bridge

volumes:
  letsencrypt:
  acme-webroot:
