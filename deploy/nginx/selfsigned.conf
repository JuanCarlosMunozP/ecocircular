# Solo se aceptan llamadas a /admin hechas por la propia app en un navegador.
# Postman, curl y scripts no envian estas cabeceras, y la barra de direcciones
# (navigate) tampoco coincide.
map "$http_sec_fetch_site:$http_sec_fetch_mode" $api_permitido {
    default          0;
    "same-origin:cors"        1;
    "same-origin:same-origin" 1;
}

server {
    listen 80;
    server_name ecocircular-obonuco.edu.co _;
    return 301 https://$host:9443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ecocircular-obonuco.edu.co _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP plano enviado al puerto 443 (p. ej. http://localhost:443): redirige a HTTPS.
    error_page 497 =301 https://$host:9443$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        if ($api_permitido = 0) { return 403; }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
